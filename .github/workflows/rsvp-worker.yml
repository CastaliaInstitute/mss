name: RSVP Worker
on:
  push:
    branches: [main]
    paths: ['workers/rsvp/**', '.github/workflows/rsvp-worker.yml']
  pull_request:
    paths: ['workers/rsvp/**', '.github/workflows/rsvp-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/rsvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/rsvp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: 'false'
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency: mss-rsvp-worker-deploy
    defaults:
      run:
        working-directory: workers/rsvp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CALDAV_PASSWORD: ${{ secrets.RSVP_CALDAV_PASSWORD }}
      RECORD_SECRET: ${{ secrets.RSVP_RECORD_SECRET }}
      TURNSTILE_SECRET_KEY: ${{ secrets.RSVP_TURNSTILE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RSVP_RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.RSVP_EMAIL_FROM }}
      MATRIX_HOMESERVER: ${{ vars.RSVP_MATRIX_HOMESERVER }}
      MATRIX_ACCESS_TOKEN: ${{ secrets.RSVP_MATRIX_ACCESS_TOKEN }}
      MATRIX_ROOM_ID: ${{ vars.RSVP_MATRIX_ROOM_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/rsvp/package-lock.json
      - run: npm ci
      - name: Upload private runtime settings
        run: node scripts/upload-secrets.mjs
      - run: npm run deploy
      - name: Check configuration readiness
        run: curl --fail --silent --show-error https://rsvp.castalia.institute/health
